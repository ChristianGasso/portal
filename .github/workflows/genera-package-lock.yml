name: Genera package-lock

on:
  push:
    paths:
      - '.github/workflows/genera-package-lock.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock
        run: |
          git config user.name "ChristianGasso"
          git config user.email "arangiochristian@gmail.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiungi package-lock per CI"
          git push
